<article class="story-card">
  <a class="story-media" href="{{ .RelPermalink }}">{{ partial "cover.html" . }}</a>
  {{ with .Params.kicker }}<p class="kicker">{{ . }}</p>{{ end }}
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  {{ with .Description }}<p class="dek">{{ . }}</p>{{ end }}
  <p class="byline">{{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read</p>
</article>
