<a class="lab-card" href="{{ .RelPermalink }}">
  <div class="lab-media">{{ partial "cover.html" . }}</div>
  <div class="lab-body">
    <div class="card-top">
      <span class="status status-{{ .Params.status | urlize }}">{{ .Params.status }}</span>
      {{ with .Params.label }}<span class="kind">{{ . }}</span>{{ end }}
    </div>
    <h3>{{ .Title }}</h3>
    <p>{{ .Description }}</p>
  </div>
</a>
