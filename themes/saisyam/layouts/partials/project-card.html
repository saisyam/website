<a class="card" href="{{ .RelPermalink }}">
  <div class="card-top">
    <span class="status status-{{ .Params.status | urlize }}">{{ .Params.status }}</span>
    {{ with .Params.label }}<span class="kind">{{ . }}</span>{{ end }}
  </div>
  <h3>{{ .Title }}</h3>
  <p>{{ .Description }}</p>
  {{ with .Params.stack }}<ul class="stack">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
</a>
