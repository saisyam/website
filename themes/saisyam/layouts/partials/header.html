<header class="masthead">
  <div class="wrap">
    <div class="masthead-top">
      <span class="dateline">Small models · Local AI · Data</span>
      <span class="dateline">{{ with site.Params.github }}<a href="https://github.com/{{ . }}">GitHub</a>{{ end }}{{ with site.Params.linkedin }}<a href="https://www.linkedin.com/in/{{ . }}">LinkedIn</a>{{ end }}</span>
    </div>
    <a class="wordmark" href="{{ "/" | relURL }}">saisyam<span>.dev</span></a>
    <nav class="mainnav">
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" {{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
